        `;
      }).join("");
      return `<svg class="chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Spend by department bar chart">${rows}</svg>`;
    }

    function renderTrendChart(points) {
      if (!points.length) return `<div class="empty-state">No trend data available.</div>`;
      const width = 760;
      const height = 282;
      const padding = { left: 54, right: 24, top: 26, bottom: 48 };
      const innerWidth = width - padding.left - padding.right;
      const innerHeight = height - padding.top - padding.bottom;
      const maxTickets = Math.max(...points.map((point) => point.tickets), 1);
      const baseline = points.map((point, index) => point.cost * (0.84 + (index % 3) * 0.055) + point.tickets * 115);
      const rawMax = Math.max(...points.map((point) => point.cost), ...baseline, 1);
      const axisMax = Math.max(8000, Math.ceil(rawMax / 8000) * 8000);
      const xFor = (index) => padding.left + (points.length > 1 ? index * (innerWidth / (points.length - 1)) : innerWidth / 2);
      const yFor = (value) => padding.top + innerHeight - (value / axisMax * innerHeight);
      const billablePoints = points.map((point, index) => [xFor(index), yFor(point.cost)]);
      const demandPoints = baseline.map((value, index) => [xFor(index), yFor(value)]);
      const billablePath = smoothPath(billablePoints);
      const demandPath = smoothPath(demandPoints);
      const grid = [0, 0.25, 0.5, 0.75, 1].map((ratio) => {
        const value = axisMax * ratio;
        const y = yFor(value);
        return `
          <line class="chart-grid-line" x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}"></line>
          <text class="axis-label" x="${padding.left - 12}" y="${y + 4}" text-anchor="end">${svgText(compactMoney(value))}</text>
        `;
      }).join("");
      const bars = points.map((point, index) => {
        const x = xFor(index) - 13;
        const barHeight = Math.max(8, point.tickets / maxTickets * 76);
        return `<rect class="volume-bar" x="${x}" y="${padding.top + innerHeight - barHeight}" width="26" height="${barHeight}" rx="7"></rect>`;
      }).join("");
      const labelEvery = Math.max(1, Math.ceil(points.length / 7));
      const labels = points.map((point, index) => {
        const lastIndex = points.length - 1;
        const shouldLabel = points.length <= 7 || index === 0 || index === lastIndex || (index % labelEvery === 0 && index <= lastIndex - labelEvery);
        if (!shouldLabel) return "";
        const x = xFor(index);
        const anchor = index === 0 ? "start" : index === lastIndex ? "end" : "middle";
        return `<text class="axis-label x-label" x="${x}" y="${height - 20}" text-anchor="${anchor}">${svgText(point.label)}</text>`;
      }).join("");
      const markerIndex = Math.min(points.length - 1, Math.max(0, Math.floor(points.length / 2)));
      const marker = billablePoints[markerIndex];
      const demandMarker = demandPoints[markerIndex];
      const point = points[markerIndex];
      const demandValue = baseline[markerIndex];
      const delta = demandValue ? (point.cost - demandValue) / demandValue * 100 : 0;
      const tooltipWidth = 176;
      const tooltipHeight = 68;
      const tooltipX = Math.min(width - padding.right - tooltipWidth, Math.max(padding.left + 12, marker[0] + 18));
      const tooltipY = Math.min(padding.top + innerHeight - tooltipHeight - 8, Math.max(padding.top + 8, marker[1] - 48));
      const billableDots = billablePoints.map((dot, index) => `<circle class="line-dot billable-dot" cx="${dot[0]}" cy="${dot[1]}" r="4.5"><title>${svgText(points[index].label + ": " + money(points[index].cost))}</title></circle>`).join("");
      const demandDots = demandPoints.map((dot, index) => `<circle class="line-dot demand-dot" cx="${dot[0]}" cy="${dot[1]}" r="3.8"><title>${svgText(points[index].label + ": " + money(baseline[index]))}</title></circle>`).join("");
      return `
        <svg class="chart trend-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Ticket volume, demand baseline, and recovered cost trend">
          ${grid}
          ${bars}
          <path class="trend-line demand-line" d="${demandPath}"></path>
          <path class="trend-line billable-line" d="${billablePath}"></path>
          ${demandDots}
          ${billableDots}
          <line class="marker-line" x1="${marker[0]}" y1="${padding.top}" x2="${marker[0]}" y2="${padding.top + innerHeight}"></line>
          <circle class="marker demand-dot" cx="${demandMarker[0]}" cy="${demandMarker[1]}" r="5"></circle>
          <circle class="marker billable-dot" cx="${marker[0]}" cy="${marker[1]}" r="5"></circle>
          <g class="trend-tooltip">
            <rect x="${tooltipX}" y="${tooltipY}" width="${tooltipWidth}" height="${tooltipHeight}" rx="8"></rect>
            <text class="tooltip-date" x="${tooltipX + 13}" y="${tooltipY + 21}">${svgText(point.label)}</text>
            <rect class="legend-square demand" x="${tooltipX + 13}" y="${tooltipY + 34}" width="7" height="7" rx="1.5"></rect>
            <text class="tooltip-value" x="${tooltipX + 27}" y="${tooltipY + 41}">${svgText(money(point.cost))}</text>
            <text class="tooltip-delta down" x="${tooltipX + 120}" y="${tooltipY + 41}">${svgText(percent(delta))}</text>
            <rect class="legend-square billable" x="${tooltipX + 13}" y="${tooltipY + 51}" width="7" height="7" rx="1.5"></rect>
            <text class="tooltip-value" x="${tooltipX + 27}" y="${tooltipY + 58}">${svgText(money(demandValue))}</text>
            <text class="tooltip-delta" x="${tooltipX + 120}" y="${tooltipY + 58}">+${svgText(percent(Math.abs(delta) / 2))}</text>
          </g>
          ${labels}
        </svg>
        <div class="legend">
          <span class="legend-item"><span class="swatch swatch-demand"></span>Demand baseline</span>
          <span class="legend-item"><span class="swatch swatch-billable"></span>Recovered cost</span>
          <span class="legend-item"><span class="swatch swatch-volume"></span>Ticket volume</span>
        </div>
      `;
    }
    function renderDonut(items) {
      const total = items.reduce((sum, item) => sum + item.total, 0);
      if (!total) return `<div class="empty-state">No cost distribution available.</div>`;
      const radius = 74;
      const circumference = 2 * Math.PI * radius;
      let offset = 0;
      const segments = items.map((item, index) => {
        const share = item.total / total;
        const dash = share * circumference;
        const segment = `<circle cx="120" cy="120" r="${radius}" fill="none" stroke="${themeColor(index)}" stroke-width="28" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 120 120)"></circle>`;
        offset += dash;
        return segment;
      }).join("");
      return `
        <div class="grid two" style="align-items:center">
          <svg viewBox="0 0 240 240" style="width:100%;max-height:275px" role="img" aria-label="Department cost distribution">
            <circle cx="120" cy="120" r="${radius}" fill="none" stroke="var(--surface-3)" stroke-width="28"></circle>
            ${segments}
            <text x="120" y="114" text-anchor="middle" font-size="18" font-weight="850" fill="var(--chart-ink)">${svgText(money(total))}</text>
            <text x="120" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="var(--chart-muted)">mode total</text>
          </svg>
          <div class="legend">
            ${items.map((item, index) => `

                <span class="swatch" style="background:${themeColor(index)}"></span>
                ${html(item.department)} ${percent(item.total / total * 100)}
              </span>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderSlaPanel() {
      const rows = state.summaries
        .filter((item) => item.breaches || item.slaImpact)
        .sort((a, b) => a.slaImpact - b.slaImpact);
      if (!rows.length) return `<div class="empty-state">No SLA breaches in the loaded dataset.</div>`;
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Department</th>
                <th class="numeric">Breaches</th>
                <th class="numeric">Breach Rate</th>
                <th class="numeric">Cost Credit</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>
                  <td><strong>${html(row.department)}</strong><br><span class="muted">${html(row.costCenter)}</span></td>
                  <td class="numeric">${row.breaches}</td>
                  <td class="numeric">${percent(row.breachRate)}</td>
                  <td class="numeric amount credit">${moneyPrecise(row.slaImpact)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderTierUtilization() {
      const tierMap = new Map();
      state.tickets.forEach((ticket) => {
        tierMap.set(ticket.tierName, (tierMap.get(ticket.tierName) || 0) + ticket.billedHours);
      });
      const rows = Array.from(tierMap.entries()).sort((a, b) => b[1] - a[1]);
      if (!rows.length) return `<div class="empty-state">No utilization data available.</div>`;
      const max = Math.max(...rows.map((row) => row[1]), 1);
      return `
        <div class="ledger-list">
          ${rows.map(([tier, hours], index) => `
            <div class="ledger-row">
              <div>
                <strong>${html(tier)}</strong>
                <div style="height:8px;background:#eef2f8;border-radius:999px;margin-top:8px;overflow:hidden">
                  <div style="height:100%;width:${Math.max(4, hours / max * 100)}%;background:${themeColor(index)}"></div>
                </div>
              </div>
              <div class="amount">${number(hours, 1)} hrs</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderDepartments() {
      const tokens = searchTokens(state.globalSearch);
      const scopedSummaries = tokens.length ? filteredSummariesForSearch(tokens) : state.summaries;
      const selected = (tokens.length ? scopedSummaries : state.summaries).find((summary) => summary.department === state.selectedDepartment) || scopedSummaries[0];
      if (!selected) return `<section class="panel"><div class="empty-state">No departments available.</div></section>`;
      const selectedCoreMatch = matchesTokens(summaryCoreSearchFields(selected), tokens);
      const activityRows = tokens.length && !selectedCoreMatch
        ? selected.tickets.filter((ticket) => matchesTokens(ticketSearchFields(ticket), tokens))
        : selected.tickets;
      return `
        <section class="grid">
          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Departmental Breakdown</h2>
                <p class="panel-subtitle">${tokens.length ? `${scopedSummaries.length} matching department ${scopedSummaries.length === 1 ? "ledger" : "ledgers"} in the current dataset.` : "Detailed ledger for department heads, including assets, tickets, overhead, SLA metrics, and clinical/security sensitivity charges."}</p>
              </div>
              <div class="field" style="min-width:240px">
                <label for="departmentSelect">Department</label>
                <select id="departmentSelect" data-action="select-department">
                  ${scopedSummaries.map((summary) => `<option value="${html(summary.department)}" ${summary.department === selected.department ? "selected" : ""}>${html(summary.department)}</option>`).join("")}
                </select>
              </div>
            </div>
            <section class="kpi-grid" style="margin-bottom:0">
              ${renderKpi("Department Total", money(selected.total), selected.costCenter, "blue")}
              ${renderKpi("Support Hours", number(selected.billedHours, 1), `${selected.ticketCount} tickets`, "green")}
              ${renderKpi("SLA Breach Rate", percent(selected.breachRate), `${selected.breaches} breached tickets`, "rose")}
              ${renderKpi("Asset Density", moneyPrecise(selected.assetDensity), "Monthly asset cost per workstation/cart", "amber")}
            </section>
          </div>

          <div class="grid two">
            <div class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">Ledger Line Items</h2>
                  <p class="panel-subtitle">${state.mode === "showback" ? "Informational allocation view." : "Invoice-ready chargeback view."}</p>
                </div>
              </div>
              ${renderLedger(selected)}
            </div>
            <div class="panel">
              <div class="panel-header">
                <div>
                  <h2 class="panel-title">Asset & License Footprint</h2>
                  <p class="panel-subtitle">Configured department subscription units and monthly base rates.</p>
                </div>
              </div>
              ${renderAssetFootprint(selected)}
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Department Ticket Detail</h2>
                <p class="panel-subtitle">${tokens.length ? `${activityRows.length} matching ${activityRows.length === 1 ? "ticket" : "tickets"} tied to ${html(selected.department)}.` : `Calculated support activity tied to ${html(selected.department)}.`}</p>
              </div>
            </div>
            ${renderTicketTable(activityRows, true)}
          </div>
        </section>
      `;
    }

    function renderLedger(summary) {
      const rows = [
        ["Asset and license subscriptions", summary.assetSubscription, "Workstations, mobile carts, telemetry devices, and SaaS seats"],
        [`Ticket support charges ${tip("SLA multipliers adjust support cost for urgency, clinical impact, and life-safety criticality.")}`, summary.supportCost, state.config.flatFeeMode ? "Flat fee by resolution tier with priority multipliers" : "Billed hours x skill rate x priority multiplier"],
        ["HIPAA / PHI sensitivity surcharge", summary.sensitivitySurcharge, `${state.config.fees.hipaaSurchargePct}% on sensitive clinical, PHI, PACS, EMR, security, and revenue cycle work`],
        ["SLA breach credit", summary.slaImpact, `${state.config.fees.slaBreachCreditPct}% credit on breached-ticket support charges`],
        [`Shared infrastructure overhead ${tip("Pro-rata overhead distributes shared enterprise IT costs by each department's share of total configured headcount.")}`, summary.overhead, "Headcount-based enterprise pro-rata allocation"],
        ["E-waste and drive destruction", summary.eWaste, `${summary.eWasteAssets} assets x ${moneyPrecise(state.config.fees.eWasteAssetFee)}`]
      ];
      return `
        <div class="ledger-list">
          ${rows.map(([label, amount, note]) => `
            <div class="ledger-row">
              <div><strong>${label}</strong><br><span class="muted">${note}</span></div>
              <div class="amount ${amount < 0 ? "credit" : ""}">${moneyPrecise(amount)}</div>
            </div>
          `).join("")}
          <div class="ledger-row">
            <div><strong>Total ${state.mode === "showback" ? "showback allocation" : "chargeback invoice"}</strong></div>
            <div class="amount">${moneyPrecise(summary.total)}</div>
          </div>
        </div>
      `;
    }

    function renderAssetFootprint(summary) {
      const rows = [
        ["Workstations / laptops", summary.workstations, state.config.assetRates.workstation, summary.workstations * state.config.assetRates.workstation],
        ["Mobile / telemetry / bedside carts", summary.carts, state.config.assetRates.mobileCart, summary.carts * state.config.assetRates.mobileCart],
        ["SaaS / M365 / workspace seats", summary.seats, state.config.assetRates.saasSeat, summary.seats * state.config.assetRates.saasSeat],
        ["E-waste / drive destruction", summary.eWasteAssets, state.config.fees.eWasteAssetFee, summary.eWaste]
      ];
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Asset / License</th>
                <th class="numeric">Units</th>
                <th class="numeric">Rate</th>
                <th class="numeric">Monthly Cost</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(([label, units, rate, cost]) => `
                <tr>
                  <td>${label}</td>
                  <td class="numeric">${number(units, 0)}</td>
                  <td class="numeric">${moneyPrecise(rate)}</td>
                  <td class="numeric amount">${moneyPrecise(cost)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderTickets() {
      const rows = filteredTickets();
      const departments = ["All", ...Array.from(new Set(state.tickets.map((ticket) => ticket.department))).sort()];
      const priorities = ["All", "Low", "Medium", "High", "Critical"];
      const sensitivities = ["All", ...Array.from(new Set(state.tickets.map((ticket) => ticket.sensitivity))).sort()];
      return `
        <section class="grid">
          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Ticket Log Inspector</h2>
                <p class="panel-subtitle">Filter uploaded tickets and inspect the row-level billing calculation.</p>
              </div>
            </div>
            ${renderUploadPanel()}
            ${renderImportHistoryPanel()}
          </div>

          <div class="panel">
            <div class="filters">
              <div class="field">
                <label for="filterSearch">Search</label>
                <input id="filterSearch" class="input" data-filter="search" placeholder="Ticket, asset, project, sensitivity..." value="${html(state.filters.search)}">
              </div>
              ${renderFilterSelect("department", "Department", departments)}
              ${renderFilterSelect("priority", "Priority", priorities)}
              ${renderFilterSelect("sensitivity", "Sensitivity", sensitivities)}
            </div>
            ${activeSearch() ? `<div class="search-inline"><span class="search-dot"></span><span>${rows.length} ${rows.length === 1 ? "ticket" : "tickets"} after global search and local filters</span></div>` : ""}
            ${renderTicketTable(rows, false)}
          </div>
        </section>
      `;
    }

    function renderFilterSelect(key, label, values) {
      return `
        <div class="field">
          <label for="filter-${key}">${label}</label>
          <select id="filter-${key}" data-filter="${key}">
            ${values.map((value) => `<option value="${html(value)}" ${state.filters[key] === value ? "selected" : ""}>${html(value)}</option>`).join("")}
          </select>
        </div>
      `;
    }

    function filteredTickets() {
      const tokens = searchTokens(state.globalSearch, state.filters.search);
      return state.tickets.filter((ticket) => {
        if (state.filters.department !== "All" && ticket.department !== state.filters.department) return false;
        if (state.filters.priority !== "All" && ticket.priority !== state.filters.priority) return false;
        if (state.filters.sensitivity !== "All" && ticket.sensitivity !== state.filters.sensitivity) return false;
        return matchesTokens(ticketSearchFields(ticket), tokens);
      });
    }

    function renderTicketTable(rows, compact) {
      if (!rows.length) return `<div class="empty-state">No tickets match the current view.</div>`;
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ticket</th>
                <th>Department</th>
                <th>Priority</th>
                <th>Sensitivity</th>
                <th>Tier</th>
                <th class="numeric">Hours</th>
                <th>SLA</th>
                ${compact ? "" : "<th>Project</th>"}
                <th class="numeric">Billable</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map((ticket) => `
                <tr>
                  <td><strong>${html(ticket.id)}</strong><br><span class="muted">${html(ticket.createdDate)}${ticket.afterHours ? " | after-hours" : ""}</span></td>
                  <td>${html(ticket.department)}</td>
                  <td><span class="pill ${ticket.priority === "Critical" ? "rose" : ticket.priority === "High" ? "amber" : "blue"}">${html(ticket.priority)} ${number(ticket.multiplier, 1)}x</span></td>
                  <td>${html(ticket.sensitivity)}<br><span class="muted">${ticket.assets.length} assets</span></td>
                  <td>${html(ticket.tierName)}<br><span class="muted">${state.config.flatFeeMode ? "flat fee" : moneyPrecise(ticket.rate) + "/hr"}</span></td>
                  <td class="numeric">${number(ticket.billedHours, 1)}</td>
                  <td><span class="pill ${ticket.breached ? "rose" : "green"}">${ticket.slaStatus}</span></td>
                  ${compact ? "" : `<td>${html(ticket.projectCode || "Operational")}</td>`}
                  <td class="numeric amount">${moneyPrecise(ticket.ticketTotal)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderSettings() {
      const settingsMeta = settingsSearchModel();
      const visible = settingsMeta.visible;
      const departmentRows = settingsMeta.departmentRows;
      const noMatches = activeSearch() && !settingsMeta.visibleCount;
      const organizationSection = visible.organization ? `
        <div class="panel settings-section">
          <div class="panel-header">
            <div>
              <h2 class="panel-title">Organizational Structure</h2>
              <p class="panel-subtitle">Departments drive pro-rata shared infrastructure overhead and asset subscription allocations.</p>
            </div>

          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Department</th>
                  <th>Cost Center</th>
                  <th class="numeric">Headcount</th>
                  <th class="numeric">Workstations</th>
                  <th class="numeric">Carts</th>
                  <th class="numeric">SaaS Seats</th>
                  <th class="numeric">E-Waste Assets</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${departmentRows.map(({ dept, index }) => `

                    ${departmentCell(index, "costCenter", dept.costCenter, "text")}
                    ${departmentCell(index, "headcount", dept.headcount, "number", true)}
                    ${departmentCell(index, "workstations", dept.workstations, "number", true)}
                    ${departmentCell(index, "carts", dept.carts, "number", true)}
                    ${departmentCell(index, "seats", dept.seats, "number", true)}
                    ${departmentCell(index, "eWasteAssets", dept.eWasteAssets, "number", true)}

                  </tr>
                `).join("")}
              </tbody>
            </table>

      return `
        <section class="grid">
          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Settings & Rates</h2>
                <p class="panel-subtitle">Customize departments, headcount allocation, resolver rates, SLA multipliers, subscriptions, compliance fees, and overhead pools.</p>
              </div>
              <div class="inline-actions">
                <button class="btn ghost" type="button" data-action="reset-config">Reset Settings</button>
                <button class="btn primary" type="button" data-action="recalculate">Recalculate</button>
              </div>
            </div>
          </div>

          ${noMatches ? `<div class="panel"><div class="empty-state">No settings match the current search.</div></div>` : ""}
          ${organizationSection}

          ${visible.hourly || visible.flat ? `
            <div class="grid two">
              ${visible.hourly ? `
                <div class="panel settings-section">
                  <div class="panel-header">
                    <div>
                      <h2 class="panel-title">Hourly & Expertise Rates</h2>
                      <p class="panel-subtitle">Used when flat fee mode is off.</p>
                    </div>
                  </div>
                  <div class="form-row">
                    ${rateInput("tier1", "Tier 1 Desktop Support")}
                    ${rateInput("tier2", "Tier 2 Advanced Field Support")}
                    ${rateInput("tier3", "Tier 3 Systems / Network Engineering")}
                    ${rateInput("clinical", "Clinical Applications Specialist")}
                    ${rateInput("cyber", "Cybersecurity / Enterprise Architect")}
                  </div>
                </div>
              ` : ""}

              ${visible.flat ? `
                <div class="panel settings-section">
                  <div class="toggle-row">
                    <div>
                      <strong>Use Ticket Resolution Flat Fees</strong>
                      <div class="muted">When enabled, tickets use tier flat fees instead of billed hours x hourly rate.</div>
                    </div>
                    <input type="checkbox" aria-label="Use flat fees" data-config-path="flatFeeMode" ${state.config.flatFeeMode ? "checked" : ""}>
                  </div>
                  <div class="form-row">
                    ${flatInput("tier0", "Tier 0")}
                    ${flatInput("tier1", "Tier 1")}
                    ${flatInput("tier2", "Tier 2")}
                    ${flatInput("tier3", "Tier 3")}
                  </div>
                </div>
              ` : ""}
            </div>
          ` : ""}

          ${visible.sla || visible.afterHours ? `
            <div class="grid two">
              ${visible.sla ? `
                <div class="panel settings-section">
                  <div class="panel-header">
                    <div>
                    <h2 class="panel-title">SLA & Priority Multipliers ${tip("Each priority tier multiplies the base labor or flat-fee support charge before surcharges and SLA credits are applied.")}</h2>
                      <p class="panel-subtitle">Adjust priority severity premiums for low, medium, high, and critical work.</p>
                    </div>
                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Priority</th>
                          <th>Description</th>
                          <th class="numeric">Multiplier</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${state.config.priorityMultipliers.map((item, index) => `
                          <tr>
                            <td><strong>${html(item.priority)}</strong></td>
                            <td><input class="input" value="${html(item.description)}" data-priority-index="${index}" data-priority-field="description"></td>
                            <td>
                              <div class="range-line">
                                <input type="range" min="0.5" max="3" step="0.05" value="${html(item.multiplier)}" data-priority-index="${index}" data-priority-field="multiplier" aria-label="${html(item.priority)} SLA multiplier">
                                <span class="amount">${number(item.multiplier, 2)}x</span>
                              </div>
                            </td>
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </div>
                </div>
              ` : ""}

              ${visible.afterHours ? `
                <div class="panel settings-section">
                  <div class="panel-header">
                    <div>
                      <h2 class="panel-title">After-Hours / On-Call Mobilization</h2>
                      <p class="panel-subtitle">Applied to tickets flagged as after-hours or on-call.</p>
                    </div>
                  </div>
                  <div class="form-row">
                    ${configInput("afterHours.flatFee", "Flat Surcharge")}
                    ${configInput("afterHours.minimumHours", "Minimum Hours")}
                    ${configInput("fees.slaBreachCreditPct", "SLA Breach Credit %")}
                  </div>
                </div>
              ` : ""}
            </div>
          ` : ""}

          ${visible.assets || visible.compliance ? `
            <div class="grid two">
              ${visible.assets ? `
                <div class="panel settings-section">
                  <div class="panel-header">
                    <div>
                      <h2 class="panel-title">Asset & License Subscriptions</h2>
                      <p class="panel-subtitle">Monthly base rates by unit type.</p>

                  <div class="form-row">
                    ${configInput("assetRates.workstation", "Workstation / Laptop")}
                    ${configInput("assetRates.mobileCart", "Mobile / Telemetry / Cart")}
                    ${configInput("assetRates.saasSeat", "SaaS / M365 Seat")}
                  </div>
                </div>
              ` : ""}

              ${visible.compliance ? `
                <div class="panel settings-section">
                  <div class="panel-header">
                    <div>
                    <h2 class="panel-title">Compliance & Overhead Fees ${tip("Compliance fees add sensitivity-based surcharges. Shared overhead is allocated pro-rata by configured department headcount.")}</h2>
                      <p class="panel-subtitle">HIPAA sensitivity surcharge, e-waste disposal, and enterprise shared services pool.</p>
                    </div>
                  </div>
                  <div class="form-row">
                    ${configInput("fees.hipaaSurchargePct", "HIPAA / PHI Surcharge %")}
                    ${configInput("fees.eWasteAssetFee", "E-Waste Fee / Asset")}
                    ${configInput("fees.sharedOverhead", "Shared Overhead Pool")}
                  </div>
                </div>
              ` : ""}
            </div>
          ` : ""}
        </section>
      `;
    }

    function guideIcon(id) {
      const attrs = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
      return {
        eye: `<svg ${attrs}><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>`,
        trace: `<svg ${attrs}><path d="M5 4h5v5H5zM14 15h5v5h-5z"></path><path d="M10 6.5h3a3 3 0 0 1 3 3V15M14 17.5h-3a3 3 0 0 1-3-3V9"></path></svg>`,
        trend: `<svg ${attrs}><path d="M4 19V5"></path><path d="M4 19h16"></path><path d="m7 15 4-4 3 2 5-6"></path></svg>`,
        shield: `<svg ${attrs}><path d="M12 3 5 6v5c0 4.4 2.7 7.6 7 9.5 4.3-1.9 7-5.1 7-9.5V6z"></path><path d="m9 12 2 2 4-4"></path></svg>`,
        clock: `<svg ${attrs}><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3 2"></path></svg>`
      }[id] || `<svg ${attrs}><circle cx="12" cy="12" r="8"></circle></svg>`;
    }

    function renderGuide() {

      const hasResults = guide.total > 0;
      return `
        <section class="guide-page" aria-label="Getting started with Qist">

              <span class="guide-kicker">Qist operating guide</span>

          ${hasResults ? `
            <div class="guide-layout">

                          </button>
                        </article>
                      `).join("")}
                    </div>
                  </section>
                ` : ""}

                ${guide.terms.length ? `
                  <section class="guide-surface guide-glossary">
                    <div class="guide-section-head">
                      <div>
                        <span>Plain-language reference</span>
                        <h3>Billing terms used in Qist</h3>
                      </div>
                    </div>
                    <dl>
                      ${guide.terms.map((item) => `
                        <div>
                          <dt>${html(item.term)}</dt>
                          <dd>${html(item.definition)}</dd>
                        </div>
                      `).join("")}
                    </dl>
                  </section>
                ` : ""}
              </div>

              <aside class="guide-sidebar" aria-label="Qist benefits and operating notes">
                ${guide.benefits.length ? `
                  <section class="guide-aside-section">
                    <span class="guide-aside-label">Why teams use Qist</span>
                    <div class="benefit-list">
                      ${guide.benefits.map((item) => `
                        <div class="benefit-item">
                          <span class="benefit-icon">${guideIcon(item.icon)}</span>
                          <div><strong>${html(item.title)}</strong><p>${html(item.text)}</p></div>
                        </div>
                      `).join("")}
                    </div>

    function readFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || "");
          const rows = file.name.toLowerCase().endsWith(".json") ? parseJson(text) : parseCsv(text);
          if (!rows.length) throw new Error("No rows found");
          state.rawRows = rows;
          state.headers = headersFromRows(rows);
          state.mapping = inferMapping(state.headers);
          state.uploadedFileName = file.name;
          state.uploadStatus = `${rows.length} rows parsed. Review mappings before exporting.`;
          clearActiveImport();
          state.importHistoryStatus = "This upload is not saved yet. Choose Save Current Import to keep it on this device.";
          state.activeView = "tickets";
          render();
        } catch (error) {
          state.uploadStatus = `Upload failed: ${error.message}`;
          render();
        }
      };
      reader.readAsText(file);
    }

    function readOrgLogo(file) {
      const isSvg = file.type.includes("svg") || /\.svg$/i.test(file.name);
      if (!file.type.startsWith("image/") && !isSvg) {
        state.uploadStatus = "Logo upload failed: choose an image file.";
        render();
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || "");
        if (isSvg) {
          storeOrgLogo(dataUrl, file.name);
          return;
        }
        resizeRasterLogo(dataUrl, file.name);
      };
      reader.onerror = () => {
        state.uploadStatus = "Logo upload failed: the file could not be read.";
        render();
      };
      reader.readAsDataURL(file);
    }

    function resizeRasterLogo(dataUrl, fileName) {
      const image = new Image();
      image.onload = () => {
        const maxWidth = 420;
        const maxHeight = 180;
        const scale = Math.min(1, maxWidth / image.width, maxHeight / image.height);
        const width = Math.max(1, Math.round(image.width * scale));
        const height = Math.max(1, Math.round(image.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(image, 0, 0, width, height);
        storeOrgLogo(canvas.toDataURL("image/png"), fileName);
      };
      image.onerror = () => {
        state.uploadStatus = "Logo upload failed: the image could not be decoded.";
        render();
      };
      image.src = dataUrl;
    }

    function storeOrgLogo(dataUrl, fileName) {
      state.config.organization.logoDataUrl = dataUrl;
      state.config.organization.logoName = fileName;
      saveConfig();
      state.uploadStatus = `Organization logo loaded: ${fileName}`;
      render();
    }

    function parseJson(text) {
      const parsed = JSON.parse(text);
      if (Array.isArray(parsed)) return parsed;
      if (Array.isArray(parsed.tickets)) return parsed.tickets;
      if (Array.isArray(parsed.records)) return parsed.records;
      if (Array.isArray(parsed.data)) return parsed.data;
      throw new Error("JSON must be an array or contain a tickets, records, or data array");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];

        if (char === '"') {
          if (quoted && next === '"') {
            field += '"';
            index += 1;
          } else {
            quoted = !quoted;
          }
          continue;
        }

        if (char === "," && !quoted) {
          row.push(field);
          field = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(field);
          if (row.some((cell) => String(cell).trim() !== "")) rows.push(row);
          row = [];
          field = "";
          continue;
        }

        field += char;
      }

      row.push(field);
      if (row.some((cell) => String(cell).trim() !== "")) rows.push(row);
      if (!rows.length) return [];

      const headers = rows.shift().map((header) => String(header).trim());
      return rows.map((values) => {
        const object = {};
        headers.forEach((header, index) => {
          object[header] = values[index] ?? "";
        });
        return object;
      });
    }

    function headersFromRows(rows) {
      const headers = new Set();
      rows.slice(0, 50).forEach((row) => {
        Object.keys(row || {}).forEach((key) => headers.add(key));
      });
      return Array.from(headers);
    }

    function exportDepartmentCsv() {
      const rows = [
        ["mode", "department", "cost_center", "line_item", "amount", "tickets", "hours", "breaches", "breach_rate"]
      ];
      state.summaries.forEach((summary) => {
        [
          ["asset_subscriptions", summary.assetSubscription],
          ["e_waste_drive_destruction", summary.eWaste],
          ["ticket_support", summary.supportCost],
          ["sensitivity_surcharge", summary.sensitivitySurcharge],
          ["sla_breach_credit", summary.slaImpact],
          ["shared_overhead", summary.overhead],
          ["total", summary.total]
        ].forEach(([line, amount]) => {
          rows.push([
            state.mode,
            summary.department,
            summary.costCenter,
            line,
            amount.toFixed(2),
            summary.ticketCount,
            summary.billedHours.toFixed(2),
            summary.breaches,
            summary.breachRate.toFixed(2)
          ]);
        });

      downloadText(`${state.mode}-department-ledger.csv`, toCsv(rows), "text/csv;charset=utf-8");

    function exportTicketCsv() {
      const rows = [
        ["mode", "ticket_id", "created_date", "closed_date", "department", "priority", "sensitivity", "assets", "device_types", "hours", "billed_hours", "sla_status", "tier", "rate", "multiplier", "after_hours", "project_code", "support_cost", "sensitivity_surcharge", "sla_impact", "billable_amount"]
      ];
      state.tickets.forEach((ticket) => {
        rows.push([
          state.mode,
          ticket.id,
          ticket.createdDate,
          ticket.closedDate,
          ticket.department,
          ticket.priority,
          ticket.sensitivity,
          ticket.assets.join("; "),
          ticket.deviceTypes.join("; "),
          ticket.hours.toFixed(2),
          ticket.billedHours.toFixed(2),
          ticket.slaStatus,
          ticket.tierName,
          ticket.rate.toFixed(2),
          ticket.multiplier.toFixed(2),
          ticket.afterHours ? "yes" : "no",

          ticket.supportCost.toFixed(2),
          ticket.sensitivitySurcharge.toFixed(2),
          ticket.slaImpact.toFixed(2),
          ticket.ticketTotal.toFixed(2)
        ]);
      });
      downloadText(`${state.mode}-ticket-calculations.csv`, toCsv(rows), "text/csv;charset=utf-8");
    }

    function exportPdf() {
      const summary = totals();
      const reportWindow = window.open("", "_blank", "width=1100,height=900");
      if (!reportWindow) {
        state.uploadStatus = "PDF export blocked by the browser. Allow pop-ups for this local app and try again.";
        render();
        return;
      }
      reportWindow.document.open();
      reportWindow.document.write(buildExecutiveReportHtml(summary));
      reportWindow.document.close();
      reportWindow.focus();
      setTimeout(() => reportWindow.print(), 450);
    }

    function toCsv(rows) {
      return rows.map((row) => row.map((cell) => `"${String(cell ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    }

    function downloadText(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    function buildPdf(lines) {
      const maxChars = 96;
      const wrapped = lines.flatMap((line) => wrapLine(line, maxChars));
      const pageSize = 46;
      const pages = [];
      for (let index = 0; index < wrapped.length; index += pageSize) {
        pages.push(wrapped.slice(index, index + pageSize));
      }

      const objects = [];
      const pageObjIds = pages.map((_, index) => 4 + index * 2);
      const contentObjIds = pages.map((_, index) => 5 + index * 2);
      objects.push("<< /Type /Catalog /Pages 2 0 R >>");
      objects.push(`<< /Type /Pages /Kids [${pageObjIds.map((id) => `${id} 0 R`).join(" ")}] /Count ${pages.length} >>`);
      objects.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");

      pages.forEach((pageLines, index) => {
        const pageId = pageObjIds[index];
        const contentId = contentObjIds[index];
        const content = [
          "BT",
          "/F1 10 Tf",
          "50 742 Td",
          "14 TL",
          ...pageLines.map((line) => `(${pdfEscape(line)}) Tj T*`),
          "ET"
        ].join("\n");
        objects[pageId - 1] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents ${contentId} 0 R >>`;
        objects[contentId - 1] = `<< /Length ${content.length} >>\nstream\n${content}\nendstream`;
      });

      let pdf = "%PDF-1.4\n";
      const offsets = [0];
      objects.forEach((object, index) => {
        offsets.push(pdf.length);
        pdf += `${index + 1} 0 obj\n${object}\nendobj\n`;
      });
      const xrefOffset = pdf.length;
      pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
      offsets.slice(1).forEach((offset) => {
        pdf += `${String(offset).padStart(10, "0")} 00000 n \n`;
      });
      pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
      return pdf;
    }

    function wrapLine(line, maxChars) {
      const clean = String(line ?? "");
      if (!clean) return [""];
      const words = clean.split(" ");
      const lines = [];
      let current = "";
      words.forEach((word) => {
        if ((current + " " + word).trim().length > maxChars) {
          if (current) lines.push(current);
          current = word;
        } else {
          current = (current + " " + word).trim();
        }
      });
      if (current) lines.push(current);
      return lines;
    }

    function pdfEscape(value) {
      return String(value ?? "")
        .replace(/[^\x09\x0A\x0D\x20-\x7E]/g, "?")
        .replace(/\\/g, "\\\\")
        .replace(/\(/g, "\\(")
        .replace(/\)/g, "\\)");
    }

    render();
    initializeImportHistory();
  </script>
