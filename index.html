<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qist - IT Chargeback & Showback Dashboard</title>
  <meta name="description" content="Client-side IT chargeback and showback dashboard for ITSM billing, SLA analysis, asset subscriptions, and department ledgers.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --ink: #111827;
      --muted: #64748b;
      --border: #d8e0ec;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --green: #0f9f6e;
      --green-soft: #dcfce7;
      --amber: #b7791f;
      --amber-soft: #fef3c7;
      --rose: #e11d48;
      --rose-soft: #ffe4e6;
      --teal: #0f766e;
      --indigo: #4f46e5;
      --shadow: 0 16px 42px rgba(15, 23, 42, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: var(--blue);
    }

    svg {
      max-width: 100%;
    }

    .topbar-inner > *,
    .command-bar > *,
    .grid > *,
    .kpi-grid > * {
      min-width: 0;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0;
      display: grid;
      grid-template-columns: minmax(230px, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .brand {
      min-width: 0;
    }

    .brand-label {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .brand-title {
      margin: 1px 0 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--ink);
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .nav-tab,
    .btn,
    .icon-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      min-height: 40px;
      border-radius: var(--radius);
      padding: 9px 12px;
      font-weight: 700;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .nav-tab:hover,
    .btn:hover,
    .icon-btn:hover {
      border-color: #b7c5d8;
      transform: translateY(-1px);
    }

    .nav-tab.active,
    .btn.primary,
    .segmented button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: white;
    }

    .btn.danger {
      color: #9f1239;
      border-color: #fecdd3;
      background: #fff1f2;
    }

    .btn.ghost {
      background: transparent;
    }

    .main {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 44px;
    }

    .command-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: stretch;
      margin-bottom: 18px;
    }

    .context-strip {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 8px;
      box-shadow: var(--shadow);
    }

    .context-title {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .context-title h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .context-title p {
      margin: 2px 0 0;
      color: var(--muted);
      max-width: 850px;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 4px 9px;
      background: #fff;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.blue {
      color: #1d4ed8;
      border-color: #bfdbfe;
      background: var(--blue-soft);
    }

    .pill.green {
      color: #047857;
      border-color: #bbf7d0;
      background: var(--green-soft);
    }

    .pill.amber {
      color: #92400e;
      border-color: #fde68a;
      background: var(--amber-soft);
    }

    .pill.rose {
      color: #be123c;
      border-color: #fecdd3;
      background: var(--rose-soft);
    }

    .segmented {
      display: inline-flex;
      align-items: center;
      gap: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      min-width: 255px;
      box-shadow: var(--shadow);
    }

    .segmented button {
      min-height: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 14px;
      font-weight: 800;
      flex: 1;
    }

    .segmented button + button {
      border-left: 1px solid var(--border);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .card,
    .panel,
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .metric-card {
      padding: 15px;
      min-height: 132px;
      display: grid;
      align-content: space-between;
      gap: 10px;
      border-top: 4px solid var(--blue);
    }

    .metric-card.green {
      border-top-color: var(--green);
    }

    .metric-card.amber {
      border-top-color: var(--amber);
    }

    .metric-card.rose {
      border-top-color: var(--rose);
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .metric-value {
      font-size: 28px;
      line-height: 1.08;
      font-weight: 850;
      letter-spacing: 0;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .metric-note {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      padding: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-title {
      margin: 0;
      font-size: 17px;
      font-weight: 850;
      letter-spacing: 0;
    }

    .panel-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .upload-panel {
      display: grid;
      gap: 14px;
    }

    .dropzone {
      border: 2px dashed #b7c5d8;
      background: #f8fafc;
      border-radius: var(--radius);
      padding: 18px;
      min-height: 118px;
      display: grid;
      place-items: center;
      text-align: center;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .dropzone.dragging {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .dropzone strong {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
    }

    .dropzone span {
      color: var(--muted);
      font-size: 13px;
    }

    .file-input {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }

    .mapping-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label,
    .field-label {
      color: #334155;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      border-radius: var(--radius);
      min-height: 38px;
      padding: 8px 10px;
      outline: none;
    }

    .input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    td.numeric,
    th.numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, minmax(150px, 0.7fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .chart {
      width: 100%;
      min-height: 250px;
      display: block;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .legend-item {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    .ledger-list {
      display: grid;
      gap: 8px;
    }

    .ledger-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding: 10px 0;
    }

    .ledger-row:last-child {
      border-bottom: 0;
    }

    .ledger-row strong {
      font-weight: 850;
    }

    .muted {
      color: var(--muted);
    }

    .amount {
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .amount.credit {
      color: var(--rose);
    }

    .settings-section {
      display: grid;
      gap: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #f8fafc;
    }

    .toggle-row input {
      width: 22px;
      height: 22px;
      accent-color: var(--blue);
    }

    .empty-state {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: #f8fafc;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1120px) {
      .topbar-inner,
      .command-bar,
      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }

      .nav-tabs {
        justify-content: flex-start;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mapping-grid,
      .filters,
      .form-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .segmented {
        width: 100%;
      }
    }

    @media (max-width: 680px) {
      .topbar-inner,
      .main {
        width: min(100% - 20px, 1480px);
      }

      .brand-title {
        font-size: 18px;
      }

      .nav-tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .nav-tab {
        white-space: nowrap;
      }

      .kpi-grid,
      .mapping-grid,
      .filters,
      .form-row {
        grid-template-columns: 1fr;
      }

      .panel-header,
      .context-title,
      .toggle-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      .metric-value {
        font-size: 24px;
      }

      .segmented {
        min-width: 0;
      }
    }

    :root {
      --bg: #f8fafc;
      --bg-elevated: #ffffff;
      --surface: rgba(255, 255, 255, 0.86);
      --surface-2: #f1f5f9;
      --surface-3: #e8edf5;
      --ink: #0f172a;
      --ink-strong: #020617;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --blue: #4f46e5;
      --blue-soft: #eef2ff;
      --green: #10b981;
      --green-soft: #dcfce7;
      --amber: #f59e0b;
      --amber-soft: #fef3c7;
      --rose: #e11d48;
      --rose-soft: #ffe4e6;
      --teal: #14b8a6;
      --indigo: #6366f1;
      --violet: #8b5cf6;
      --shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 1px 2px rgba(15, 23, 42, 0.06);
      --glow-indigo: 0 0 0 rgba(99, 102, 241, 0);
      --chart-grid: #e2e8f0;
      --chart-muted: #64748b;
      --chart-ink: #0f172a;
      --nav-width: 260px;
      --radius: 8px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101214;
      --bg-elevated: #15181b;
      --surface: rgba(28, 31, 35, 0.86);
      --surface-2: #171a1e;
      --surface-3: #22262b;
      --ink: #e5e7eb;
      --ink-strong: #f4f4f5;
      --muted: #9ca3af;
      --muted-2: #747b84;
      --border: #30343a;
      --border-strong: #3e454d;
      --blue: #a3aab4;
      --blue-soft: rgba(148, 163, 184, 0.14);
      --green: #34d399;
      --green-soft: rgba(16, 185, 129, 0.15);
      --amber: #fbbf24;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --rose: #fb7185;
      --rose-soft: rgba(225, 29, 72, 0.18);
      --teal: #7dd3c7;
      --indigo: #b4bac3;
      --violet: #8f969f;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.04);
      --glow-indigo: 0 0 34px rgba(148, 163, 184, 0.12);
      --chart-grid: #343941;
      --chart-muted: #9aa1aa;
      --chart-ink: #f1f3f5;
    }

    body {
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--bg) 86%, var(--surface-2)), var(--bg) 340px),
        var(--bg);
      color: var(--ink);
      transition: background 220ms ease, color 220ms ease;
    }

    ::selection {
      background: color-mix(in srgb, var(--blue) 24%, transparent);
    }

    .app-shell {
      min-height: 100vh;
    }

    .product-shell {
      display: grid;
      grid-template-columns: var(--nav-width) minmax(0, 1fr);
      min-height: 100vh;
      min-width: 0;
      overflow-x: clip;
    }

    .product-shell > *,
    .sidebar > *,
    .content-shell > * {
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(18px);
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 18px;
      z-index: 30;
    }

    .qist-brand {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 11px;
      align-items: center;
      padding: 4px 3px 10px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: 0;
      background:
        linear-gradient(135deg, var(--blue), var(--teal));
      box-shadow: var(--glow-indigo), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .brand-title {
      margin: 0;
      font-size: 18px;
      font-weight: 850;
      color: var(--ink-strong);
    }

    .brand-label {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .sidebar-section-label {
      margin: 0 8px 7px;
      color: var(--muted-2);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .sidebar-nav {
      display: grid;
      gap: 4px;
    }

    .nav-tab {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      min-height: 42px;
      border-radius: var(--radius);
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 9px;
      align-items: center;
      text-align: left;
      font-weight: 760;
      box-shadow: none;
    }

    .nav-tab:hover {
      background: color-mix(in srgb, var(--surface-2) 78%, transparent);
      color: var(--ink);
      border-color: var(--border);
      transform: none;
    }

    .nav-tab.active {
      background: color-mix(in srgb, var(--blue-soft) 74%, var(--surface));
      border-color: color-mix(in srgb, var(--blue) 28%, var(--border));
      color: var(--ink-strong);
      box-shadow: inset 3px 0 0 var(--blue), var(--shadow-soft);
    }

    .nav-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: color-mix(in srgb, var(--surface-2) 82%, transparent);
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .nav-tab.active .nav-icon {
      background: var(--blue);
      color: #ffffff;
    }

    .nav-meta {
      color: var(--muted-2);
      font-size: 11px;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .sidebar-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface-2) 72%, transparent);
      padding: 11px;
      display: grid;
      gap: 7px;
    }

    .sidebar-card strong {
      font-size: 12px;
      color: var(--ink-strong);
    }

    .sidebar-card .mini-stat {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .content-shell {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 24;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      width: min(100% - 32px, 1440px);
      padding: 12px 0;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 14px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-title h1 {
      margin: 0;
      color: var(--ink-strong);
      font-size: 17px;
      font-weight: 840;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }

    .global-search-wrap {
      position: relative;
      width: min(360px, 32vw);
      min-width: 210px;
    }

    .global-search-wrap::before {
      content: "/";
      position: absolute;
      left: 11px;
      top: 50%;
      translate: 0 -50%;
      color: var(--muted-2);
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-weight: 800;
      pointer-events: none;
    }

    .global-search {
      width: 100%;
      min-height: 38px;
      padding: 8px 11px 8px 29px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink);
      background: color-mix(in srgb, var(--surface-2) 55%, transparent);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .global-search:focus {
      border-color: color-mix(in srgb, var(--blue) 70%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
      background: var(--bg-elevated);
    }

    .main {
      width: min(100% - 32px, 1440px);
      padding: 18px 0 28px;
    }

    .command-bar {
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-bottom: 14px;
    }

    .context-strip,
    .panel,
    .metric-card,
    .card {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px);
      transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease, transform 160ms ease;
    }

    .panel {
      padding: 14px;
    }

    .panel:hover,
    .metric-card:hover,
    .context-strip:hover {
      border-color: color-mix(in srgb, var(--blue) 22%, var(--border));
      box-shadow: var(--shadow);
    }

    .context-strip {
      padding: 12px 13px;
    }

    .context-title h2,
    .panel-title {
      color: var(--ink-strong);
      font-size: 15px;
      letter-spacing: 0;
    }

    .context-title p,
    .panel-subtitle {
      color: var(--muted);
      font-size: 12px;
    }

    .kpi-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .metric-card {
      position: relative;
      overflow: hidden;
      padding: 13px;
      min-height: 122px;
      border-top: 1px solid var(--border);
      border-left: 3px solid var(--blue);
    }

    .metric-card.green {
      border-left-color: var(--green);
    }

    .metric-card.amber {
      border-left-color: var(--amber);
    }

    .metric-card.rose {
      border-left-color: var(--rose);
    }

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 820;
    }

    .metric-value {
      color: var(--ink-strong);
      font-size: 26px;
      font-weight: 850;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .metric-note {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    .metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 3px 7px;
      color: var(--green);
      background: var(--green-soft);
      border: 1px solid color-mix(in srgb, var(--green) 28%, transparent);
      font-size: 11px;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-weight: 800;
      white-space: nowrap;
    }

    .metric-trend.down {
      color: var(--rose);
      background: var(--rose-soft);
      border-color: color-mix(in srgb, var(--rose) 28%, transparent);
    }

    .sparkline {
      width: 100%;
      height: 22px;
      margin-top: 2px;
      color: var(--blue);
      opacity: 0.9;
    }

    .metric-card.green .sparkline {
      color: var(--green);
    }

    .metric-card.amber .sparkline {
      color: var(--amber);
    }

    .metric-card.rose .sparkline {
      color: var(--rose);
    }

    .pill {
      border-color: var(--border);
      background: color-mix(in srgb, var(--surface-2) 72%, transparent);
      color: var(--muted);
      font-size: 11px;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .pill.blue {
      color: var(--indigo);
      border-color: color-mix(in srgb, var(--indigo) 34%, var(--border));
      background: var(--blue-soft);
    }

    .pill.green {
      color: var(--green);
      border-color: color-mix(in srgb, var(--green) 34%, var(--border));
      background: var(--green-soft);
    }

    .pill.amber {
      color: var(--amber);
      border-color: color-mix(in srgb, var(--amber) 38%, var(--border));
      background: var(--amber-soft);
    }

    .pill.rose {
      color: var(--rose);
      border-color: color-mix(in srgb, var(--rose) 38%, var(--border));
      background: var(--rose-soft);
    }

    .btn,
    .icon-btn {
      border-color: var(--border);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      color: var(--ink);
      min-height: 38px;
      box-shadow: var(--shadow-soft);
    }

    .btn:hover,
    .icon-btn:hover {
      border-color: color-mix(in srgb, var(--blue) 32%, var(--border));
      background: var(--bg-elevated);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .btn.primary {
      border-color: color-mix(in srgb, var(--blue) 76%, transparent);
      background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 92%, #ffffff), var(--blue));
      color: #ffffff;
      box-shadow: var(--glow-indigo), 0 1px 0 rgba(255, 255, 255, 0.18) inset;
    }

    .btn.danger {
      color: var(--rose);
      border-color: color-mix(in srgb, var(--rose) 34%, var(--border));
      background: var(--rose-soft);
    }

    .segmented {
      min-width: 265px;
      border-color: var(--border);
      background: color-mix(in srgb, var(--surface-2) 64%, transparent);
      box-shadow: var(--shadow-soft);
    }

    .segmented button {
      color: var(--muted);
      min-height: 38px;
      padding: 8px 12px;
    }

    .segmented button.active {
      background: var(--blue);
      color: #ffffff;
      box-shadow: var(--glow-indigo);
    }

    .theme-toggle {
      min-width: 96px;
      display: inline-grid;
      grid-template-columns: 34px 1fr;
      align-items: center;
      gap: 7px;
    }

    .theme-switch {
      position: relative;
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--surface-3) 78%, transparent);
      border: 1px solid var(--border);
    }

    .theme-switch::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      top: 2px;
      left: 2px;
      border-radius: 999px;
      background: var(--ink-strong);
      transition: transform 180ms ease, background 180ms ease;
    }

    [data-theme="dark"] .theme-switch::after {
      transform: translateX(14px);
      background: var(--green);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.52);
    }

    .input,
    select,
    textarea {
      border-color: var(--border);
      background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
      color: var(--ink);
      box-shadow: var(--shadow-soft);
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .input:focus,
    select:focus,
    textarea:focus {
      border-color: color-mix(in srgb, var(--blue) 70%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
    }

    input[type="number"] {
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .range-line {
      min-width: 190px;
      display: grid;
      grid-template-columns: minmax(110px, 1fr) 56px;
      align-items: center;
      gap: 9px;
    }

    .field label,
    .field-label {
      color: var(--muted);
      font-size: 11px;
    }

    .dropzone {
      border-color: color-mix(in srgb, var(--blue) 24%, var(--border));
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--blue-soft) 62%, transparent), transparent),
        color-mix(in srgb, var(--surface-2) 82%, transparent);
      min-height: 118px;
    }

    .dropzone.dragging {
      border-color: var(--green);
      background: color-mix(in srgb, var(--green-soft) 72%, var(--surface));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 16%, transparent);
    }

    .dropzone strong {
      color: var(--ink-strong);
    }

    .dropzone span,
    .muted {
      color: var(--muted);
    }

    details {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface-2) 66%, transparent);
      padding: 10px;
    }

    summary {
      cursor: pointer;
      color: var(--ink-strong);
      font-weight: 780;
    }

    .table-wrap {
      border-color: var(--border);
      background: var(--surface);
      max-height: min(62vh, 680px);
      overflow: auto;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 4;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface-2) 86%, var(--surface));
      border-bottom-color: var(--border);
      font-size: 11px;
    }

    td {
      border-bottom-color: var(--border);
      color: var(--ink);
    }

    tbody tr {
      transition: background 140ms ease;
    }

    tbody tr:hover {
      background: color-mix(in srgb, var(--blue-soft) 42%, transparent);
    }

    td.numeric,
    th.numeric,
    .amount,
    td strong,
    .metric-trend,
    .nav-meta {
      font-variant-numeric: tabular-nums;
    }

    td.numeric,
    .amount {
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .amount {
      color: var(--ink-strong);
    }

    .amount.credit {
      color: var(--rose);
    }

    .ledger-row {
      border-bottom-color: var(--border);
      padding: 9px 0;
    }

    .toggle-row,
    .empty-state {
      border-color: var(--border);
      background: color-mix(in srgb, var(--surface-2) 76%, transparent);
    }

    .tooltip {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: color-mix(in srgb, var(--surface-2) 78%, transparent);
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      cursor: help;
    }

    .tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 9px);
      width: min(260px, 76vw);
      translate: -50% 4px;
      opacity: 0;
      pointer-events: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 9px;
      color: var(--ink);
      background: var(--bg-elevated);
      box-shadow: var(--shadow);
      font-size: 12px;
      font-weight: 650;
      text-transform: none;
      line-height: 1.35;
      z-index: 80;
      transition: opacity 140ms ease, translate 140ms ease;
    }

    .tooltip:hover::after,
    .tooltip:focus-visible::after {
      opacity: 1;
      translate: -50% 0;
    }

    .chart {
      color: var(--chart-ink);
    }

    .legend-item {
      color: var(--muted);
    }

    .app-footer {
      width: min(100% - 32px, 1440px);
      margin: 0 auto;
      padding: 0 0 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .app-footer a {
      color: var(--ink-strong);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--blue) 45%, transparent);
    }

    @media (max-width: 1180px) {
      .product-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: sticky;
        height: auto;
        top: 0;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        align-items: start;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 10px 14px;
        overflow: hidden;
        width: 100%;
      }

      .sidebar-card {
        display: none;
      }

      .sidebar-section-label {
        display: none;
      }

      .sidebar-nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        justify-content: flex-start;
        width: 100%;
      }

      .nav-tab {
        width: auto;
        min-width: max-content;
      }
    }

    @media (max-width: 760px) {
      .topbar-inner {
        width: min(100% - 20px, 1440px);
        grid-template-columns: 1fr;
      }

      .header-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        justify-content: stretch;
      }

      .global-search-wrap {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
      }

      .main,
      .app-footer {
        width: min(100% - 20px, 1440px);
      }

      .command-bar {
        grid-template-columns: 1fr;
      }

      .kpi-grid {
        grid-template-columns: 1fr;
      }

      .theme-toggle,
      .header-actions .btn {
        width: 100%;
        justify-content: center;
      }

      .sidebar {
        align-items: start;
        grid-template-columns: 1fr;
      }

      .sidebar-nav {
        justify-content: flex-start;
        width: 100%;
      }
    }

    /* Mirai-inspired Qist refinement */
    :root {
      --bg: #f6f6f7;
      --bg-elevated: #ffffff;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --surface-3: #eceff3;
      --ink: #232529;
      --ink-strong: #17191d;
      --muted: #6b7280;
      --muted-2: #9ca3af;
      --border: #e4e6ea;
      --border-strong: #d2d6dc;
      --blue: #111827;
      --blue-soft: #eef2ff;
      --green: #159f82;
      --green-soft: #e4f8f2;
      --amber: #f59e0b;
      --amber-soft: #fff4da;
      --rose: #d84c4c;
      --rose-soft: #ffe8e8;
      --nav-width: 214px;
      --shadow: 0 10px 28px rgba(17, 24, 39, 0.06);
      --shadow-soft: 0 1px 2px rgba(17, 24, 39, 0.08);
    }

    [data-theme="dark"] {
      --bg: #101214;
      --bg-elevated: #15181b;
      --surface: #1c1f23;
      --surface-2: #171a1e;
      --surface-3: #24282e;
      --ink: #e5e7eb;
      --ink-strong: #f4f4f5;
      --muted: #9ca3af;
      --muted-2: #747b84;
      --border: #30343a;
      --border-strong: #3e454d;
      --blue: #a3aab4;
      --blue-soft: rgba(148, 163, 184, 0.14);
      --green: #34d399;
      --green-soft: rgba(16, 185, 129, 0.15);
      --amber: #fbbf24;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --rose: #fb7185;
      --rose-soft: rgba(225, 29, 72, 0.18);
    }

    body {
      background: var(--bg);
    }

    .product-shell {
      grid-template-columns: var(--nav-width) minmax(0, 1fr);
      background: var(--bg);
    }

    .sidebar {
      padding: 0;
      gap: 0;
      background: color-mix(in srgb, var(--surface-2) 82%, var(--surface));
      border-right: 1px solid var(--border-strong);
      box-shadow: none;
    }

    .qist-brand {
      height: 72px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border-strong);
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--ink-strong);
      color: var(--bg-elevated);
      box-shadow: none;
    }

    .brand-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 800;
      line-height: 1;
    }

    .brand-label {
      margin-top: 3px;
      font-size: 10px;
      color: var(--muted-2);
    }

    .sidebar-search {
      padding: 13px 10px;
      border-bottom: 1px solid var(--border);
    }

    .side-search-input {
      min-height: 30px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: color-mix(in srgb, var(--surface) 58%, var(--surface-3));
      color: var(--ink);
      padding: 7px 10px;
      width: 100%;
      outline: none;
    }

    .side-search-input:focus {
      border-color: var(--border-strong);
      background: var(--surface);
    }

    .sidebar-block {
      padding: 12px 9px 2px;
    }

    .sidebar-section-label {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 650;
      color: var(--muted-2);
      text-transform: none;
    }

    .sidebar-nav {
      gap: 5px;
    }

    .nav-tab {
      min-height: 30px;
      grid-template-columns: 19px minmax(0, 1fr) auto;
      gap: 7px;
      padding: 5px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .nav-tab.active {
      background: var(--surface);
      border-color: var(--border-strong);
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.10);
      color: var(--ink-strong);
    }

    .nav-icon {
      width: 19px;
      height: 19px;
      border-radius: 5px;
      font-size: 9px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
    }

    .nav-tab.active .nav-icon {
      background: var(--surface-2);
      color: var(--ink-strong);
      border-color: var(--border-strong);
    }

    .nav-meta {
      display: none;
    }

    .sidebar-user {
      margin: 12px 14px 10px;
      padding: 8px;
      border-radius: 8px;
      background: var(--surface);
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-soft);
    }

    .avatar-mini {
      width: 31px;
      height: 31px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--ink-strong), var(--green));
      color: var(--bg-elevated);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 850;
    }

    .sidebar-user strong,
    .sidebar-user span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-user strong {
      color: var(--ink-strong);
      font-size: 11px;
    }

    .sidebar-user span {
      color: var(--muted);
      font-size: 10px;
    }

    .topbar {
      height: 72px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      border-bottom: 1px solid var(--border-strong);
      box-shadow: none;
    }

    .topbar-inner {
      height: 72px;
      width: 100%;
      padding: 0 20px;
      grid-template-columns: auto minmax(260px, 1fr) auto;
      align-items: center;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 780;
    }

    .header-actions {
      gap: 8px;
    }

    .global-search-wrap {
      justify-self: center;
      width: min(380px, 40vw);
    }

    .global-search {
      min-height: 38px;
      border-radius: 8px;
      border-color: transparent;
      background: color-mix(in srgb, var(--surface) 92%, var(--surface-2));
      box-shadow: none;
    }

    .icon-only,

    .icon-only {
      width: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    }


    .main {
      width: 100%;
      max-width: none;
      padding: 16px 18px 28px;
    }

    .command-bar {
      display: none;
    }

    .mirai-dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 278px;
      gap: 16px;
      align-items: start;
    }

    .dashboard-primary,
    .right-rail {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .market-kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .dark-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 4px 10px;
      background: var(--ink-strong);
      color: var(--bg-elevated);
      font-size: 12px;
      font-weight: 760;
    }

    .soft-chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 4px 10px;
      background: color-mix(in srgb, var(--surface-3) 70%, transparent);
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
    }

    .market-title-row,
    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .market-title-row h2,
    .section-title-row h2 {
      margin: 0;
      color: var(--ink-strong);
      font-size: 18px;
      font-weight: 780;
    }

    .market-filters {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .driver-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .driver-card,
    .rail-card,
    .chart-panel,
    .recent-panel {
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .driver-card {
      min-height: 132px;
      padding: 15px;
      display: grid;
      gap: 12px;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;

    /* Precision pass: typography, sidebar rhythm, and reference-grade charting */
    :root {

      --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Mono", Consolas, monospace;
      --canvas-bg: #f7f7f7;
      --sidebar-bg: #eeeeef;

      --hairline: #e3e3e5;
      --hairline-strong: #d3d4d8;
      --ink-strong: #202124;
      --ink: #2e3137;
      --muted: #626a73;
      --muted-2: #9ba1a8;
      --chart-grid: #e7e7ea;
      --chart-muted: #6f7780;
      --line-demand: #202124;
      --line-billable: #159f82;
      --line-dot: #202124;

    [data-theme="dark"] {

      --ink: #dedfe3;
      --muted: #a2a9b1;
      --muted-2: #747b84;
      --chart-grid: #343941;

      --line-demand: #e8eaed;

      --line-dot: #e8eaed;
      --volume-fill: rgba(148, 163, 184, 0.18);

    .sidebar-search::before,
    .global-search-wrap::before {
      content: "";
      position: absolute;
      width: 13px;
      height: 13px;
      border: 1.6px solid #8d96a0;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1;
    }

    .sidebar-search::after,
    .global-search-wrap::after {
      content: "";
      position: absolute;
      width: 6px;

      background: #8d96a0;

    .sidebar-search::before {
      left: 20px;
      top: 22px;
    }

    .sidebar-search::after {
      left: 31px;
      top: 34px;

    .global-search-wrap::before {
      left: 14px;

    /* Minimal status signals: text plus a lit dot instead of colored pills */

    .term-item .pill.blue,
    .recent-panel td .pill.green,

      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      font-family: var(--font-sans);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 480;
      line-height: 1.2;
      color: var(--main-muted);

    .portfolio-item .gain-pill::before,
    .rail-card .muted + .gain-pill::before,
    .term-item .pill.blue::before,
    .recent-panel td .pill.green::before,
    .recent-panel td .pill.rose::before {

      height: 6px;

    .term-item .pill.blue {

    .term-item .pill.blue::before {
      background: var(--indigo);

      align-items: center;
      justify-content: flex-start;
      gap: 7px;

      height: auto;
      padding: 0;
      border: 0;
      border-radius: 0 !important;
      background: transparent;
      box-shadow: none;
      color: var(--main-muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 450;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;

    }

    }

    .pill.blue {
      color: var(--indigo);

    .pill.amber {
      color: #9a6700;

    .pill.rose,

    .soft-chip::before,
    .pill::before,
    .gain-pill::before {

      width: 6px;
      height: 6px;
      border-radius: 999px;
      flex: 0 0 auto;
      background: var(--main-muted);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--main-muted) 10%, transparent),

    .pill.green::before,

    .pill.blue::before {

    .pill.amber::before {

    .pill.rose::before,
    .gain-pill.loss::before {

    /* Premium theme switch */
    .header-actions .theme-toggle {
      position: relative;
      isolation: isolate;
      display: inline-grid;
      grid-template-columns: 50px max-content;
      align-items: center;
      gap: 9px;
      min-width: 104px;
      min-height: 36px;
      padding: 5px 10px 5px 6px;
      border: 1px solid color-mix(in srgb, var(--border) 78%, transparent);
      border-radius: 8px !important;
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--bg-elevated) 96%, #ffffff 4%),
        color-mix(in srgb, var(--surface-2) 84%, transparent)) !important;
      color: var(--main-ink);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .7) inset,
        0 8px 22px rgba(15, 23, 42, .055);
      appearance: none;
      cursor: pointer;
      font: inherit;
      overflow: hidden;
      user-select: none;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .header-actions .theme-toggle:hover {
      border-color: color-mix(in srgb, var(--indigo) 28%, var(--border));
      box-shadow: 0 1px 0 rgba(255, 255, 255, .78) inset,
        0 10px 24px rgba(15, 23, 42, .08);
      transform: translateY(-1px);
    }

    .header-actions .theme-toggle:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--indigo) 40%, transparent);
      outline-offset: 2px;
    }

    .theme-rail {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      width: 46px;
      height: 24px;
      padding: 2px;
      border: 1px solid color-mix(in srgb, var(--border) 86%, transparent);
      border-radius: 7px;
      background: color-mix(in srgb, var(--surface-3) 68%, transparent);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, .08);
    }

    .theme-icon {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 20px;
      height: 18px;
      color: color-mix(in srgb, var(--main-muted) 84%, transparent);
      opacity: .62;
      transition: color 180ms ease, opacity 180ms ease;
    }

    .theme-icon svg {
      width: 12px;
      height: 12px;
    }

    .theme-thumb {
      position: absolute;
      z-index: 1;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 18px;
      border: 1px solid color-mix(in srgb, var(--border) 74%, transparent);
      border-radius: 5px;
      background: linear-gradient(180deg, #ffffff, color-mix(in srgb, var(--surface) 92%, #ffffff));
      box-shadow: 0 1px 0 rgba(255, 255, 255, .86) inset,
        0 6px 14px rgba(15, 23, 42, .16);
      transition: transform 220ms cubic-bezier(.2, .8, .2, 1), background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .theme-copy {
      color: var(--main-ink);
      font-size: 12px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: 0;
    }

    [data-theme="light"] .theme-icon-light,
    [data-theme="dark"] .theme-icon-dark {
      color: var(--main-ink);
      opacity: 1;
    }

    [data-theme="dark"] .header-actions .theme-toggle {
      border-color: color-mix(in srgb, var(--hairline) 82%, transparent);

      box-shadow: 0 1px 0 rgba(255, 255, 255, .07) inset,
        0 0 0 1px color-mix(in srgb, var(--green) 7%, transparent),
        0 12px 30px rgba(0, 0, 0, .28);

    [data-theme="dark"] .theme-rail {

      background: color-mix(in srgb, #101214 86%, var(--surface-2));
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .38);
    }

    [data-theme="dark"] .theme-thumb {
      transform: translateX(22px);
      border-color: color-mix(in srgb, var(--green) 28%, transparent);
      background: linear-gradient(180deg, color-mix(in srgb, var(--green) 82%, #ffffff), var(--green));

        0 0 18px color-mix(in srgb, var(--green) 44%, transparent),

    function clone(value) {

    function loadConfig() {
      try {
        const saved = window.localStorage.getItem(storageKey);
        if (!saved) return clone(defaultConfig);
        const parsed = JSON.parse(saved);
        return mergeConfig(clone(defaultConfig), parsed);
      } catch (error) {
        return clone(defaultConfig);
      }
    }

    function mergeConfig(base, override) {
      if (!override || typeof override !== "object") return base;
      Object.keys(override).forEach((key) => {
        if (Array.isArray(override[key])) {
          base[key] = override[key];
        } else if (override[key] && typeof override[key] === "object" && base[key]) {
          base[key] = mergeConfig(base[key], override[key]);
        } else {
          base[key] = override[key];
        }
      });
      return base;
    }

    let importDbPromise;

    function openImportDb() {
      if (!("indexedDB" in window)) {
        return Promise.reject(new Error("IndexedDB is not available in this browser."));
      }
      if (importDbPromise) return importDbPromise;
      importDbPromise = new Promise((resolve, reject) => {
        const request = window.indexedDB.open(importDbName, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains(importStoreName)) {
            const store = db.createObjectStore(importStoreName, { keyPath: "id" });
            store.createIndex("savedAt", "savedAt", { unique: false });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error("Import history could not be opened."));
      });
      return importDbPromise;
    }

    async function importStoreRequest(mode, callback) {
      const db = await openImportDb();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(importStoreName, mode);
        const store = transaction.objectStore(importStoreName);
        let request;
        try {
          request = callback(store);
        } catch (error) {
          reject(error);
          return;
        }
        if (request) {
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("Import history request failed."));
        } else {
          transaction.oncomplete = () => resolve();
        }
        transaction.onerror = () => reject(transaction.error || new Error("Import history transaction failed."));
      });
    }

    async function getAllImportRecords() {
      return importStoreRequest("readonly", (store) => store.getAll());

    async function getImportRecord(id) {

    async function putImportRecord(record) {

    async function refreshImportHistory(renderAfter = false) {
      if (!("indexedDB" in window)) {
        state.importHistory = [];
        state.importHistoryReady = false;
        state.importHistoryStatus = "Import History needs a browser with IndexedDB support.";
        if (renderAfter) render();

      try {
        const records = await getAllImportRecords();
        state.importHistory = records
          .map(summarizeImportRecord)
          .sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
        state.importHistoryReady = true;
        if (!state.importHistoryStatus) {
          state.importHistoryStatus = state.importHistory.length
            ? `${state.importHistory.length} saved ${state.importHistory.length === 1 ? "import" : "imports"} on this device.`
            : "No saved imports yet.";
        }
      } catch (error) {
        state.importHistory = [];
        state.importHistoryReady = false;
        state.importHistoryStatus = `Import History unavailable: ${error.message}`;
      }
      if (renderAfter) render();

    function formatImportDate(value) {

    function applyImportRecord(record, status) {
      if (!record || !Array.isArray(record.rows)) throw new Error("Saved import is missing ticket rows.");
      state.rawRows = clone(record.rows);
      state.headers = Array.isArray(record.headers) && record.headers.length ? record.headers : headersFromRows(record.rows);
      state.mapping = record.mapping && typeof record.mapping === "object" ? record.mapping : inferMapping(state.headers);
      state.uploadedFileName = record.sourceFileName || record.name || "Saved import";
      state.uploadStatus = status || `${record.rowCount || record.rows.length} rows restored from Import History.`;
      state.activeImportId = record.id;
      state.filters = { search: "", department: "All", priority: "All", sensitivity: "All" };
      saveActiveImportId(record.id);

    async function saveCurrentImport() {
      if (!state.rawRows.length) {
        state.importHistoryStatus = "There are no rows to save yet.";
        render();
        return;
      }
      try {
        const existing = state.importHistory.find((item) => item.id === state.activeImportId);
        const record = {
          id: state.activeImportId || createImportId(),
          name: existing?.name || createImportName(),
          sourceFileName: state.uploadedFileName,
          savedAt: new Date().toISOString(),
          rowCount: state.rawRows.length,
          headers: clone(state.headers),
          mapping: clone(state.mapping),
          rows: clone(state.rawRows)
        };
        await putImportRecord(record);
        state.activeImportId = record.id;
        saveActiveImportId(record.id);
        await refreshImportHistory(false);
        state.importHistoryStatus = `${record.rowCount} rows saved locally as ${record.name}.`;
        state.uploadStatus = `${record.rowCount} rows saved to Import History.`;
      } catch (error) {
        state.importHistoryStatus = `Save failed: ${error.message}`;

      render();

    async function initializeImportHistory() {

    function defaultMapping() {
      return Object.fromEntries(fieldDefinitions.map((field) => [field.key, field.key]));
    }

    function html(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function money(value) {
      const amount = Number.isFinite(value) ? value : 0;
      return amount.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    }

    function moneyPrecise(value) {
      const amount = Number.isFinite(value) ? value : 0;
      return amount.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function number(value, digits = 1) {
      const amount = Number.isFinite(value) ? value : 0;
      return amount.toLocaleString("en-US", { maximumFractionDigits: digits });
    }

    function percent(value) {
      const amount = Number.isFinite(value) ? value : 0;
      return amount.toLocaleString("en-US", { maximumFractionDigits: 1 }) + "%";
    }

    function compactMoney(value) {
      const amount = Number.isFinite(value) ? value : 0;
      const abs = Math.abs(amount);
      if (abs >= 1000000) return "$" + number(amount / 1000000, 1) + "m";
      if (abs >= 1000) return "$" + number(amount / 1000, 0) + "k";
      return money(amount);
    }

    function parseNumber(value, fallback = 0) {
      if (typeof value === "number") return Number.isFinite(value) ? value : fallback;
      const parsed = Number(String(value ?? "").replace(/[$,%\s]/g, ""));
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function normalizeHeader(value) {
      return String(value ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function inferMapping(headers) {
      const normalized = headers.map((header) => ({ raw: header, normalized: normalizeHeader(header) }));
      const used = new Set();
      const mapping = {};

      fieldDefinitions.forEach((field) => {
        const aliases = [field.key, field.label, ...field.aliases].map(normalizeHeader).filter(Boolean);
        let best = { raw: "", score: 0 };

        normalized.forEach((header) => {
          if (used.has(header.raw)) return;
          aliases.forEach((alias) => {
            let score = 0;
            if (header.normalized === alias) score = 100;
            else if (header.normalized.includes(alias)) score = 75;
            else if (alias.includes(header.normalized) && header.normalized.length > 2) score = 55;
            if (score > best.score) best = { raw: header.raw, score };
          });
        });

        mapping[field.key] = best.raw;
        if (best.raw) used.add(best.raw);
      });

      return mapping;
    }

    function getMappedValue(row, key) {
      const mapped = state.mapping[key] || key;
      const value = row[mapped];
      if (Array.isArray(value)) return value.join("; ");
      if (value && typeof value === "object") return JSON.stringify(value);
      return value ?? "";
    }

    function normalizePriority(value) {
      const text = String(value ?? "").toLowerCase();
      if (/critical|emergency|life|sev\s*1|p1/.test(text)) return "Critical";
      if (/high|urgent|sev\s*2|p2/.test(text)) return "High";
      if (/medium|normal|sev\s*3|p3/.test(text)) return "Medium";
      return "Low";
    }

    function normalizeTier(value, sensitivity) {
      const text = String(value ?? "").toLowerCase();
      const sensitive = String(sensitivity ?? "").toLowerCase();
      if (/tier\s*0|self|auto/.test(text)) return "tier0";
      if (/clinical|epic|cerner|pacs|emr/.test(text)) return "clinical";
      if (/cyber|security|architect/.test(text)) return "cyber";
      if (/tier\s*3|level\s*3|network|systems|engineering/.test(text)) return "tier3";
      if (/tier\s*2|level\s*2|field|advanced/.test(text)) return "tier2";
      if (/tier\s*1|level\s*1|desktop|service desk/.test(text)) return "tier1";
      if (/security/.test(sensitive)) return "cyber";
      if (/clinical|emr|pacs/.test(sensitive)) return "clinical";
      return "tier1";
    }

    function tierLabel(tier) {
      return {
        tier0: "Tier 0 Self-Service",
        tier1: "Tier 1 Desktop Support",
        tier2: "Tier 2 Advanced Field Support",
        tier3: "Tier 3 Systems / Network Engineering",
        clinical: "Clinical Applications Specialist",
        cyber: "Cybersecurity / Enterprise Architect"
      }[tier] || "Tier 1 Desktop Support";
    }

    function flatTierKey(tier) {
      if (tier === "tier0") return "tier0";
      if (tier === "tier3" || tier === "clinical" || tier === "cyber") return "tier3";
      if (tier === "tier2") return "tier2";
      return "tier1";
    }

    function priorityConfig(priority) {
      const normalized = normalizePriority(priority);
      return state.config.priorityMultipliers.find((item) => item.priority === normalized) || state.config.priorityMultipliers[0];
    }

    function rateForTier(tier) {
      const rates = state.config.hourlyRates;
      return {
        tier0: 0,
        tier1: rates.tier1,
        tier2: rates.tier2,
        tier3: rates.tier3,
        clinical: rates.clinical,
        cyber: rates.cyber
      }[tier] || rates.tier1;
    }

    function splitList(value) {
      return String(value ?? "")
        .split(/[;,|]/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function isAfterHours(value) {
      return /yes|true|after|on.?call|off.?hours|y\b|1/.test(String(value ?? "").toLowerCase());
    }

    function isBreached(value) {
      return /breach|miss|violat|fail|late/.test(String(value ?? "").toLowerCase());
    }

    function isSensitive(value) {
      return /phi|hipaa|clinical|emr|pacs|security|life|safety|revenue cycle/.test(String(value ?? "").toLowerCase());
    }

    function canonicalDepartment(value) {
      const raw = String(value ?? "").trim();
      if (!raw) return "Unassigned";
      const matched = state.config.departments.find((dept) => dept.name.toLowerCase() === raw.toLowerCase() || dept.costCenter.toLowerCase() === raw.toLowerCase());
      return matched ? matched.name : raw;
    }

    function parseDateValue(dateValue) {
      const dateText = String(dateValue ?? "").trim();
      const dateOnly = dateText.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (dateOnly) {
        return new Date(Number(dateOnly[1]), Number(dateOnly[2]) - 1, Number(dateOnly[3]));
      }
      const date = new Date(dateValue);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function monthKey(dateValue) {
      const date = parseDateValue(dateValue);
      if (!date) return "Unknown";
      return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
    }

    function monthLabel(key) {
      if (key === "Unknown") return "Unknown";
      const date = new Date(key + "-01T00:00:00");
      return date.toLocaleDateString("en-US", { month: "short", year: "numeric" });
    }

    function weekKey(dateValue) {
      const date = parseDateValue(dateValue);
      if (!date) return "Unknown";
      const weekStart = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const mondayOffset = (weekStart.getDay() + 6) % 7;
      weekStart.setDate(weekStart.getDate() - mondayOffset);
      return [
        weekStart.getFullYear(),
        String(weekStart.getMonth() + 1).padStart(2, "0"),
        String(weekStart.getDate()).padStart(2, "0")
      ].join("-");
    }

    function weekLabel(key) {
      if (key === "Unknown") return "Unknown";
      const date = new Date(key + "T00:00:00");
      if (Number.isNaN(date.getTime())) return "Unknown";
      return "Week of " + date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    function trendPeriodLabel(key, granularity) {
      return granularity === "weekly" ? weekLabel(key) : monthLabel(key);
    }

    function trendKeyForTicket(ticket, granularity) {
      return granularity === "weekly" ? ticket.week : ticket.month;
    }

    function computeTicket(row, index) {
      const rawPriority = getMappedValue(row, "priority") || "Low";
      const createdDate = String(getMappedValue(row, "createdDate") || "");
      const closedDate = String(getMappedValue(row, "closedDate") || "");
      const sensitivity = String(getMappedValue(row, "sensitivity") || "General IT");
      const tier = normalizeTier(getMappedValue(row, "tier"), sensitivity);
      const priority = normalizePriority(rawPriority);
      const priorityRule = priorityConfig(priority);
      const hours = Math.max(0, parseNumber(getMappedValue(row, "hours")));
      const afterHours = isAfterHours(getMappedValue(row, "afterHours"));
      const breached = isBreached(getMappedValue(row, "slaStatus"));
      const sensitive = isSensitive(sensitivity);
      const billedHours = state.config.flatFeeMode ? hours : (afterHours ? Math.max(hours, state.config.afterHours.minimumHours) : hours);
      const rate = rateForTier(tier);
      const flatFee = state.config.flatFees[flatTierKey(tier)] || 0;
      const laborBase = state.config.flatFeeMode ? flatFee : billedHours * rate;
      const afterHoursFee = afterHours ? state.config.afterHours.flatFee : 0;
      const supportCost = (laborBase * priorityRule.multiplier) + afterHoursFee;
      const sensitivitySurcharge = sensitive ? supportCost * (state.config.fees.hipaaSurchargePct / 100) : 0;
      const slaImpact = breached ? -(supportCost * (state.config.fees.slaBreachCreditPct / 100)) : 0;
      const ticketTotal = supportCost + sensitivitySurcharge + slaImpact;
      const assets = splitList(getMappedValue(row, "assets"));
      const deviceTypes = splitList(getMappedValue(row, "deviceTypes"));

      return {
        rowIndex: index,
        id: String(getMappedValue(row, "ticketId") || "ROW-" + String(index + 1).padStart(3, "0")),
        createdDate,
        closedDate,
        department: canonicalDepartment(getMappedValue(row, "department")),
        priority,
        sensitivity,
        assets,
        deviceTypes,
        hours,
        billedHours,
        slaStatus: breached ? "Breached" : "Met",
        breached,
        tier,
        tierName: tierLabel(tier),
        rate,
        multiplier: priorityRule.multiplier,
        afterHours,
        afterHoursFee,
        projectCode: String(getMappedValue(row, "projectCode") || ""),
        supportCost,
        sensitivitySurcharge,
        slaImpact,
        ticketTotal,
        month: monthKey(createdDate),
        week: weekKey(createdDate)
      };
    }

    function departmentAssetCosts(dept) {
      const assetSubscription =
        parseNumber(dept.workstations) * state.config.assetRates.workstation +
        parseNumber(dept.carts) * state.config.assetRates.mobileCart +
        parseNumber(dept.seats) * state.config.assetRates.saasSeat;
      const eWaste = parseNumber(dept.eWasteAssets) * state.config.fees.eWasteAssetFee;
      return { assetSubscription, eWaste, total: assetSubscription + eWaste };
    }

    function aggregate() {
      state.tickets = state.rawRows.map((row, index) => computeTicket(row, index));
      const totalHeadcount = Math.max(1, state.config.departments.reduce((sum, dept) => sum + parseNumber(dept.headcount), 0));
      const map = new Map();

      state.config.departments.forEach((dept) => {
        map.set(dept.name, {
          department: dept.name,
          costCenter: dept.costCenter,
          headcount: parseNumber(dept.headcount),
          workstations: parseNumber(dept.workstations),
          carts: parseNumber(dept.carts),
          seats: parseNumber(dept.seats),
          eWasteAssets: parseNumber(dept.eWasteAssets),
          ticketCount: 0,
          hours: 0,
          billedHours: 0,
          supportCost: 0,
          sensitivitySurcharge: 0,
          slaImpact: 0,
          breaches: 0,
          tierMix: {},
          tickets: []
        });
      });

      state.tickets.forEach((ticket) => {
        if (!map.has(ticket.department)) {
          map.set(ticket.department, {
            department: ticket.department,
            costCenter: "Unmapped",
            headcount: 0,
            workstations: 0,
            carts: 0,
            seats: 0,
            eWasteAssets: 0,
            ticketCount: 0,
            hours: 0,
            billedHours: 0,
            supportCost: 0,
            sensitivitySurcharge: 0,
            slaImpact: 0,
            breaches: 0,
            tierMix: {},
            tickets: []
          });
        }
        const summary = map.get(ticket.department);
        summary.ticketCount += 1;
        summary.hours += ticket.hours;
        summary.billedHours += ticket.billedHours;
        summary.supportCost += ticket.supportCost;
        summary.sensitivitySurcharge += ticket.sensitivitySurcharge;
        summary.slaImpact += ticket.slaImpact;
        summary.breaches += ticket.breached ? 1 : 0;
        summary.tierMix[ticket.tierName] = (summary.tierMix[ticket.tierName] || 0) + ticket.billedHours;
        summary.tickets.push(ticket);
      });

      state.summaries = Array.from(map.values()).map((summary) => {
        const configDept = state.config.departments.find((dept) => dept.name === summary.department) || summary;
        const assetCosts = departmentAssetCosts(configDept);
        const overhead = state.config.fees.sharedOverhead * (summary.headcount / totalHeadcount);
        const ticketTotal = summary.supportCost + summary.sensitivitySurcharge + summary.slaImpact;
        const total = ticketTotal + assetCosts.total + overhead;
        const deviceUnits = summary.workstations + summary.carts;
        return {
          ...summary,
          assetSubscription: assetCosts.assetSubscription,
          eWaste: assetCosts.eWaste,
          assetCost: assetCosts.total,
          overhead,
          ticketTotal,
          total,
          breachRate: summary.ticketCount ? summary.breaches / summary.ticketCount * 100 : 0,
          assetDensity: deviceUnits ? assetCosts.total / deviceUnits : 0
        };
      }).sort((a, b) => b.total - a.total);

      state.trend = trendForTickets(state.tickets, state.trendGranularity);

      if (!state.summaries.some((summary) => summary.department === state.selectedDepartment)) {
        state.selectedDepartment = state.summaries[0]?.department || "";
      }
    }

    function totals() {
      return {
        total: state.summaries.reduce((sum, item) => sum + item.total, 0),
        ticketTotal: state.summaries.reduce((sum, item) => sum + item.ticketTotal, 0),
        hours: state.tickets.reduce((sum, item) => sum + item.billedHours, 0),
        tickets: state.tickets.length,
        breaches: state.tickets.filter((ticket) => ticket.breached).length,
        slaImpact: state.tickets.reduce((sum, item) => sum + item.slaImpact, 0),
        topDepartment: state.summaries[0]?.department || "None"
      };
    }

    function activeSearch() {
      return String(state.globalSearch || "").trim();
    }

    function searchTokens(...values) {
      return values
        .map((value) => String(value ?? "").trim().toLowerCase())
        .filter(Boolean)
        .join(" ")
        .split(/\s+/)
        .filter(Boolean);
    }

    function flattenSearchValues(values, output = []) {
      values.forEach((value) => {
        if (Array.isArray(value)) flattenSearchValues(value, output);
        else if (value !== null && value !== undefined) output.push(value);
      });
      return output;
    }

    function matchesTokens(fields, tokens) {
      if (!tokens.length) return true;
      const text = flattenSearchValues(fields).join(" ").toLowerCase();
      return tokens.every((token) => text.includes(token));
    }

    function ticketSearchFields(ticket) {
      return [
        ticket.id,
        ticket.createdDate,
        ticket.closedDate,
        ticket.department,
        ticket.priority,
        ticket.sensitivity,
        ticket.slaStatus,
        ticket.tierName,
        ticket.projectCode || "Operational",
        ticket.afterHours ? "after hours on call" : "",
        ticket.assets,
        ticket.deviceTypes,
        ticket.billedHours,
        ticket.rate,
        ticket.multiplier,
        ticket.ticketTotal,
        moneyPrecise(ticket.ticketTotal)
      ];
    }

    function summaryCoreSearchFields(summary) {
      return [
        summary.department,
        summary.costCenter,
        summary.headcount,
        summary.workstations,
        summary.carts,
        summary.seats,
        summary.eWasteAssets,
        summary.ticketCount,
        summary.billedHours,
        summary.breaches,
        summary.total,
        moneyPrecise(summary.total),
        "department cost center headcount workstations carts saas seats e waste assets ledger invoice"
      ];
    }

    function summarySearchFields(summary) {
      return [
        summaryCoreSearchFields(summary),
        summary.tickets.map((ticket) => ticketSearchFields(ticket))
      ];
    }

    function ticketsForGlobalSearch(tokens = searchTokens(state.globalSearch)) {
      if (!tokens.length) return state.tickets;
      return state.tickets.filter((ticket) => matchesTokens(ticketSearchFields(ticket), tokens));
    }

    function filteredSummariesForSearch(tokens = searchTokens(state.globalSearch)) {
      if (!tokens.length) return state.summaries;
      return state.summaries.filter((summary) => matchesTokens(summarySearchFields(summary), tokens));
    }

    function trendForTickets(tickets, granularity = state.trendGranularity) {
      const trendMap = new Map();
      tickets.forEach((ticket) => {
        const key = trendKeyForTicket(ticket, granularity) || "Unknown";
        if (!trendMap.has(key)) trendMap.set(key, { key, label: trendPeriodLabel(key, granularity), tickets: 0, cost: 0, hours: 0 });
        const bucket = trendMap.get(key);
        bucket.tickets += 1;
        bucket.cost += ticket.ticketTotal;
        bucket.hours += ticket.billedHours;
      });
      return Array.from(trendMap.values()).sort((a, b) => a.key.localeCompare(b.key));
    }

    function departmentConfigFields(dept) {
      return [
        dept.name,
        dept.costCenter,
        dept.headcount,
        dept.workstations,
        dept.carts,
        dept.seats,
        dept.eWasteAssets,
        "department cost center headcount workstations carts saas seats e waste assets organizational structure pro rata overhead"
      ];
    }

    function settingsSearchModel(tokens = searchTokens(state.globalSearch)) {
      const departmentRows = state.config.departments
        .map((dept, index) => ({ dept, index }))
        .filter(({ dept }) => matchesTokens(departmentConfigFields(dept), tokens));
      const allDepartmentFields = state.config.departments.map((dept) => departmentConfigFields(dept));
      const dictionaries = {
        organization: ["organizational structure department departments cost center headcount pro rata overhead allocation", allDepartmentFields],
        hourly: "hourly expertise rates dollars per hour tier 1 desktop support tier 2 advanced field support tier 3 systems network engineering clinical applications specialist cybersecurity enterprise architect",
        flat: "ticket resolution flat fees tier 0 self service automated tier 1 tier 2 tier 3 optional alternative hourly",
        sla: "sla priority multipliers low medium high critical standard urgent emergency life safety operational support",
        afterHours: "after hours on call mobilization surcharge flat fee minimum hours sla breach credit penalty",
        assets: "asset license subscriptions workstation laptop mobile telemetry bedside cart saas m365 workspace seat monthly rate",
        compliance: "compliance overhead hipaa phi high sensitivity surcharge e waste hard drive destruction shared infrastructure overhead"
      };
      const visible = Object.fromEntries(Object.entries(dictionaries).map(([key, fields]) => [key, matchesTokens([fields], tokens)]));
      const visibleCount = Object.values(visible).filter(Boolean).length;
      return {
        visible,
        visibleCount,
        departmentRows: tokens.length ? departmentRows : state.config.departments.map((dept, index) => ({ dept, index }))
      };
    }

        ]
      };
    }

    function guideSearchModel(tokens = searchTokens(state.globalSearch)) {
      const content = guideContentModel();
      const keep = (item) => !tokens.length || matchesTokens([item.title, item.text, item.term, item.definition, item.keywords], tokens);
      const steps = content.steps.filter(keep);
      const benefits = content.benefits.filter(keep);
      const terms = content.terms.filter(keep);
      return { steps, benefits, terms, total: steps.length + benefits.length + terms.length };
    }

    function searchResultLabel() {
      const tokens = searchTokens(state.globalSearch);
      if (!tokens.length) return "";
      if (state.activeView === "tickets") {
        const rows = filteredTickets();
        return `${number(rows.length, 0)} ${rows.length === 1 ? "ticket" : "tickets"}`;
      }
      if (state.activeView === "departments") {
        const rows = filteredSummariesForSearch(tokens);
        return `${number(rows.length, 0)} ${rows.length === 1 ? "department" : "departments"}`;
      }
      if (state.activeView === "settings") {
        const meta = settingsSearchModel(tokens);
        return `${number(meta.visibleCount, 0)} settings ${meta.visibleCount === 1 ? "area" : "areas"}`;
      }
      if (state.activeView === "appearance") {
        return "Brand profile";
      }
      if (state.activeView === "guide") {
        const meta = guideSearchModel(tokens);
        return `${number(meta.total, 0)} guide ${meta.total === 1 ? "topic" : "topics"}`;
      }
      if (state.activeView === "exports") {
        const rows = filteredSummariesForSearch(tokens);
        return `${number(rows.length, 0)} ${rows.length === 1 ? "department preview" : "department previews"}`;
      }
      const departments = filteredSummariesForSearch(tokens).length;
      const tickets = ticketsForGlobalSearch(tokens).length;
      return `${number(departments, 0)} ${departments === 1 ? "department" : "departments"}, ${number(tickets, 0)} ${tickets === 1 ? "ticket" : "tickets"}`;
    }

      return {

    function renderSparkline(values) {
      const safeValues = values.length ? values.map((value) => parseNumber(value)) : [2, 4, 3, 6, 5, 8];
      const min = Math.min(...safeValues);
      const max = Math.max(...safeValues);
      const spread = Math.max(1, max - min);
      const width = 160;
      const height = 24;
      const points = safeValues.map((value, index) => {
        const x = safeValues.length === 1 ? width / 2 : index * (width / (safeValues.length - 1));
        const y = height - 3 - ((value - min) / spread * (height - 6));
        return [x, y];
      });
      const path = smoothPath(points);
      const area = `${path} L ${width} ${height} L 0 ${height} Z`;
      return `
        <svg class="sparkline" viewBox="0 0 ${width} ${height}" aria-hidden="true">
          <path d="${area}" fill="currentColor" opacity="0.10"></path>
          <path d="${path}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
        </svg>
      `;
    }

    function smoothPath(points) {
      if (points.length < 2) return "";
      return points.reduce((path, point, index) => {
        if (index === 0) return `M ${point[0]} ${point[1]}`;
        const previous = points[index - 1];
        const cx = (previous[0] + point[0]) / 2;
        return `${path} C ${cx} ${previous[1]}, ${cx} ${point[1]}, ${point[0]} ${point[1]}`;
      }, "");
    }

    function renderBarChart(items) {

      const chartWidth = width - left - right;
      const rows = items.map((item, index) => {

        const color = themeColor(index);
        return `
